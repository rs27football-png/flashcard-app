name: Deploy to GitHub Pages

on:
  # main への push で本番公開する.
  push:
    branches: [main]
  # PR ではビルドのみ行う. マージ前に失敗を検知するため (CLAUDE.md ブランチ運用).
  pull_request:
  # Actions 画面から手動で再実行できるようにする.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする. 実行中のものは中断せず順に流す.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: dist を Pages 用の成果物として保存
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # 公開するのは main への push のときだけ. PR ではビルドの成否確認までとする.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
